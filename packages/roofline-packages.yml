  distribution: on-request
  note: >-
    Ahead-of-time compiler SDK with a Python entry point. The product page shows
    the import name as `attic` and the call as `attic.compile(model, (input,))`.
    No package by that name belonging to Roofline exists on PyPI — pypi.org/pypi/attic
