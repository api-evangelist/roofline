summary: >-
  Roofline ships an SDK, a runtime and a benchmarking/dashboard tool as its core
  commercial products, but it publishes NONE of them to any package registry.
  There is no pip wheel, no npm package, no crate, no Maven artifact and no
  GitHub release anywhere in the RooflineAI organization. Every product page ends
  at the same sentence — "Just reach out through our Contact Us form" — so the
  distribution channel is a sales conversation, not a registry. This is an honest
  zero, recorded rather than omitted.

