aid: roofline
name: Roofline
description: >-
  Roofline (RooflineAI GmbH, Köln, Germany) is a 2024 RWTH Aachen University
  spin-off building a retargetable AI compiler stack for edge deployment. Its
  three products are an SDK that compiles models ahead of time from any
  framework — the product page shows a single Python call, attic.compile(model,
  (input,)) — a lightweight C runtime with Python bindings that executes the
  compiled model and orchestrates heterogeneous SoCs, and a Performance Dashboard
  fed by a roofbench command-line tool running nightly benchmarks across hundreds
  of models for latency, throughput and memory footprint. The stack is built on
  open-source MLIR and IREE with proprietary hardware-specific optimization on
  top, and targets NPUs, MCUs and heterogeneous SoCs with quantization (INT8,
  blocked, symmetric, asymmetric, dynamic), dynamic shapes for on-device LLMs and
  mixture-of-experts support. Published work includes NXP eIQ Neutron NPU LLM
  enablement, Vulkan 1.3 and Arm SVE support in IREE, and day-0 support for
  Liquid AI LFM2. Roofline is a strategic partner of the Edge AI Foundation and
  raised a seed round from Serena and First Momentum Ventures. It sells compiler
  licenses to hardware vendors and embedded software teams: there is no developer
  program, no public API, no documentation host and no registry-published
  package. Every product page ends at a Contact Sales form, and the only
  machine-readable document Roofline publishes anywhere is an llms.txt on its
  marketing site.
